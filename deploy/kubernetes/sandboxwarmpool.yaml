# The pool the app server claims sandboxes from. Its name is the default sandbox
# spec id (see kubernetes_sandbox_spec_service.py); define more pools to offer
# users a choice of runtimes.
#
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: openhands-pool
  namespace: default
spec:
  replicas: 1
  sandboxTemplateRef:
    name: openhands-agent-server
---
# Keep this at zero until the digest-pinned Windows image is configured.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: windows-server-2025-amd64
  namespace: default
spec:
  replicas: 0
  sandboxTemplateRef:
    name: openhands-agent-server-windows-2025
